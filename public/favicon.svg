<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VocaDig">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="16" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ecfeff" />
    </linearGradient>
    <clipPath id="panel">
      <rect x="6" y="6" width="52" height="52" rx="14" />
    </clipPath>
  </defs>

  <!-- 土台（ガラスの縁取り） -->
  <rect width="64" height="64" rx="17" fill="#0f172a" />

  <!-- クリアアクリル板：ミクシアンのグラデーション＋内側ハイライト -->
  <g clip-path="url(#panel)">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#glass)" />
    <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#sheen)" />
    <rect x="7.5" y="7.5" width="49" height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.75" />
    <rect x="7.5" y="55" width="49" height="1.2" rx="0.6" fill="#0f172a" fill-opacity="0.18" />
  </g>

  <!-- 1px の半透明白枠線＋内側の細い陰影線（外側の発光は付けない） -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1" />
  <rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1" />

  <!-- シャープな白い「V」 -->
  <path d="M14 16 L23 16 L32 38 L41 16 L50 16 L32 49 Z" fill="url(#letter)" />
</svg>
