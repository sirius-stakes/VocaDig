<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VocaDig - ムード・BPM・音声ライブラリでボカロ曲を発掘するディグアプリ"
    />
    <title>VocaDig - ボカロ曲ディグ</title>
    <script>
      try {
        const stored = localStorage.getItem('vocadig-theme');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const dark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        /* localStorage が使えない環境ではシステム設定に任せる */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
