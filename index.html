<!doctype html>
<html lang="ja" data-accent="miku">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06b6d4" />
    <title>VocaDig - 条件から、好きな曲から、ボカロ曲をディグる。</title>
    <meta
      name="description"
      content="ムード・BPM・音声ライブラリ（8色テーマ対応）や好きな曲からの類似レコメンドで、まだ知らないボカロ曲を直感的にディグれるWebアプリ。"
    />

    <!-- ブラウザタブ用ファビコン -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (SNS 共有時のプレビュー) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VocaDig" />
    <meta property="og:title" content="VocaDig | 条件から、好きな曲から、ボカロ曲をディグる。" />
    <meta
      property="og:description"
      content="ムード・BPM・音声ライブラリや好きな曲からの類似レコメンドで、まだ知らない一曲を掘り出そう。"
    />
    <meta property="og:url" content="https://voca-dig.vercel.app/" />
    <meta property="og:image" content="https://voca-dig.vercel.app/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card (X 共有時のプレビュー) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VocaDig | 条件から、好きな曲から、ボカロ曲をディグる。" />
    <meta
      name="twitter:description"
      content="ムード・BPM・音声ライブラリや好きな曲からの類似レコメンドで、まだ知らない一曲を掘り出そう。"
    />
    <meta name="twitter:image" content="https://voca-dig.vercel.app/ogp.png" />

    <script>
      try {
        const stored = localStorage.getItem('vocadig-theme');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const dark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', dark);

        // 推しカラーテーマも描画前に適用して色のちらつきを防ぐ
        const accentIds = [
          'miku',
          'teto',
          'rinlen',
          'luka',
          'kafu',
          'flower',
          'gumi',
          'zundamon',
        ];
        const accent = localStorage.getItem('vocadig-accent-theme');
        if (accent && accentIds.includes(accent)) {
          document.documentElement.dataset.accent = accent;
        }
      } catch {
        /* localStorage が使えない環境ではシステム設定に任せる */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
