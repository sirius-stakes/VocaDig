<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06b6d4" />
    <meta
      name="description"
      content="VocaDig（ボカディグ）は、ムード・BPM・音声ライブラリの条件検索（Filter Dig）と、好きな曲からの類似度レコメンド（Like-to-Dig）でボカロ曲を発掘するディグアプリです。"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VocaDig" />
    <meta property="og:title" content="VocaDig（ボカディグ）| ボカロ曲をディグる" />
    <meta
      property="og:description"
      content="ムード・BPM・音声ライブラリで掘る条件検索と、好きな曲から似た曲を探す類似度レコメンド。試聴ミニプレイヤーとマイリスト共有を備えたボカロ曲ディグアプリ。"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="VocaDig（ボカディグ）| ボカロ曲をディグる"
    />
    <meta
      name="twitter:description"
      content="条件検索（Filter Dig）と類似度レコメンド（Like-to-Dig）で、まだ知らないボカロ曲を発掘しよう。"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>VocaDig（ボカディグ）| ボカロ曲ディグアプリ</title>
    <script>
      try {
        const stored = localStorage.getItem('vocadig-theme');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const dark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        /* localStorage が使えない環境ではシステム設定に任せる */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
